[package]
name = "skills-mgr"
version = "0.1.0"
edition = "2024"
description = "Read the skills-mgr catalog and skill files from Rust without subprocesses"
license = "MIT"
repository = "https://github.com/yusing/skills-mgr"
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[dependencies]
cap-std = "4.0.3"
diffy = "0.5.2"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize", "serialize"] }
sha2 = "0.11.1"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
