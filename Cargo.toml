[package]
name = "skills-mgr"
version = "0.2.1"
edition = "2024"
description = "Read the skills-mgr catalog and skill files from Rust"
license = "MIT"
repository = "https://github.com/yusing/skills-mgr"
include = ["/src", "/tests/read_api.rs", "/README.md", "/LICENSE"]

[workspace]
members = ["crates/skills-mgr-cli", "crates/skills-mgr-shell"]
resolver = "3"

[features]
# Internal interface for the workspace's executable, not part of the read API.
cli-support = []

[workspace.dependencies]
brush-parser = "0.4.0"
cap-std = "4.0.3"
diffy = "0.5.2"
dirs = "7.0.0"
libc = "0.2.191"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize", "serialize"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }

[dependencies]
brush-parser.workspace = true
cap-std.workspace = true
diffy.workspace = true
dirs.workspace = true
gix-discover = "0.57.1"
gix-hash = { version = "0.28.1", features = ["sha1", "sha256"] }
gix-index = "0.58.0"
gix-path = "0.14.1"
gomod-parser = "0.6.0"
ignore = "0.4.34"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
skills-mgr-shell = { version = "0.1.0", path = "crates/skills-mgr-shell" }
thiserror = "2.0.21"
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
