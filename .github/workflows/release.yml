name: Release bundles

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected version tag after all bundles pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, platform: linux-x86_64 }
          - { runner: ubuntu-22.04-arm, platform: linux-aarch64 }
          - { runner: macos-15-intel, platform: darwin-x86_64 }
          - { runner: macos-15, platform: darwin-aarch64 }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Set up Rust
        run: rustup update stable --no-self-update
      - name: Test Rust core
        run: cargo +stable test --locked --features cli
      - name: Test Go companion
        run: go test -mod=readonly ./...
      - name: Build and smoke-test archive
        env:
          PLATFORM: ${{ matrix.platform }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          stage="$RUNNER_TEMP/stage"
          extracted="$RUNNER_TEMP/extracted"
          mkdir -p "$stage/bin" "$extracted"
          cargo +stable build --locked --release --features cli --bin skills-mgr
          install -m 755 "$CARGO_TARGET_DIR/release/skills-mgr" "$stage/bin/skills-mgr"
          CGO_ENABLED=0 go build -mod=readonly -trimpath -ldflags='-s -w' -o "$stage/bin/skills-mgr-tui" .
          cp LICENSE "$stage/"
          archive="skills-mgr-$PLATFORM.tar.gz"
          tar -czf "$archive" -C "$stage" bin LICENSE
          tar -xzf "$archive" -C "$extracted"
          python3 tests/release_smoke.py "$extracted/bin"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: skills-mgr-${{ matrix.platform }}
          path: skills-mgr-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.publish
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: skills-mgr-*
          merge-multiple: true
      - name: Publish tested bundles
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          assets=(
            skills-mgr-linux-x86_64.tar.gz
            skills-mgr-linux-aarch64.tar.gz
            skills-mgr-darwin-x86_64.tar.gz
            skills-mgr-darwin-aarch64.tar.gz
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --generate-notes "${assets[@]}"
